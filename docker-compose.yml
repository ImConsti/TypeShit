services:
  migrate:
    build: ./backend
    command: ["npm", "run", "db:migrate"]
    env_file:
      - ./backend/.env

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend