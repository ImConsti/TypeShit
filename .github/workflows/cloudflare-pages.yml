name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cf-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # If you're using "next export" (static export), keep this:
      # - name: Export
      #   run: npm run export

      - name: Deploy to Cloudflare Pages (Preview for PRs, Production for main)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy
            .vercel/output/static
            --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--branch=main' || format('--branch=pr-{0}', github.event.pull_request.number) }}
